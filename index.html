<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Rise™ Game Engine (2D Edition)</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #1a0000;
      color: #fff;
    }
    #editor {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #canvasContainer {
      flex: 1;
      overflow: auto;
      background-color: #300000;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background-color: #1c1c1c;
    }
    #toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px;
      background-color: #2e0000;
      gap: 5px;
    }
    button, input[type="file"] {
      padding: 5px;
      background-color: #660000;
      border: none;
      border-radius: 4px;
      color: #fff;
    }
    #library {
      display: flex;
      overflow-x: auto;
      gap: 5px;
      padding: 10px;
      background-color: #1c0000;
    }
    #library img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      cursor: pointer;
      border: 2px solid transparent;
    }
    #library img.selected {
      border-color: #fff;
    }
  
    #joystick {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #joystick-inner {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
    }

    #player {
      position: absolute;
      width: 30px;
      height: 30px;
      background: red;
      z-index: 9999;
    }
  
    #toolbar button.selected {
     background-color: #ff3333;
    }
  </style>
</head>
<body>
  <div id="editor">
    <div id="toolbar">
      <input type="file" id="uploadImage" accept="image/*" />
      <button onclick="zoomOut()">-</button>
      <button onclick="zoomIn()">+</button>
      <button onclick="addRow()">Add Row</button>
      <button onclick="addCol()">Add Column</button>
      <button onclick="downloadHTML()">Export Game</button>
      <button id="placeBtn" onclick="setMode('place')">Place</button>  
      <button id="removeBtn" onclick="setMode('remove')">Remove</button>
      <button onclick="saveMap()">Save</button>
      <button onclick="loadMap()">Load</button>
    </div>
    <div id="library"></div>
    <div id="canvasContainer">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    <div id="player"></div>
    <div id="joystick">
    <div id="joystick-inner"></div>
    <button id="jumpBtn" style="
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 80px;
  height: 80px;
  background: rgba(255, 255, 255, 0.2);
  color: white;
  font-size: 18px;
  border-radius: 50%;
  border: 2px solid white;
  z-index: 1000;
  ">JUMP</button>
   </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let scale = 40;
    let rows = 15;
    let cols = 20;
    let map = Array.from({ length: rows }, () => Array(cols).fill(null));
    const images = [];
    let selectedImage = null;
    let mode = 'place';const player = document.getElementById('player');
let velocityX = 0, velocityY = 0;
let isJumping = false;
let gravity = 1;
let onGround = false;

const joystick = document.getElementById("joystick");
const joystickInner = document.getElementById("joystick-inner");
let joyPos = { x: 0, y: 0 };
let joystickActive = false;
let keys = {};
let gamepadIndex = null;

function updateLibrary() {
  const library = document.getElementById('library');
  library.innerHTML = '';
  images.forEach((img, i) => {
    const thumb = document.createElement('img');
    thumb.src = img.src;
    thumb.onclick = () => {
      document.querySelectorAll('#library img').forEach(el => el.classList.remove('selected'));
      thumb.classList.add('selected');
      selectedImage = img;
    };
    library.appendChild(thumb);
  });
}

document.getElementById('uploadImage').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const img = new Image();
    img.onload = () => {
      images.push(img);
      updateLibrary();
    };
    img.src = URL.createObjectURL(file);
  }
});

function drawMap() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const img = map[y][x];
      if (img) ctx.drawImage(img, x * scale, y * scale, scale, scale);
      ctx.strokeStyle = '#333';
      ctx.strokeRect(x * scale, y * scale, scale, scale);
    }
  }
}

function isColliding(x, y) {
  const col = Math.floor(x / scale);
  const row = Math.floor(y / scale);
  return map[row] && map[row][col] !== null;
}

function updatePlayer() {
  let moveX = joyPos.x || (keys['ArrowRight'] || keys['d'] ? 1 : keys['ArrowLeft'] || keys['a'] ? -1 : 0);
  velocityX = moveX * 4;

  if ((keys[' '] || keys['ArrowUp'] || keys['w']) && onGround) {
    isJumping = true;
  }

  if (isJumping) {
    velocityY = -15;
    isJumping = false;
    onGround = false;
  }

  velocityY += gravity;

  let newX = player.offsetLeft + velocityX;
  let newY = player.offsetTop + velocityY;

  const playerMidX = newX + player.offsetWidth / 2;
  const playerBottomY = newY + player.offsetHeight;

  if (isColliding(playerMidX, playerBottomY)) {
    newY = Math.floor(playerBottomY / scale) * scale - player.offsetHeight;
    velocityY = 0;
    onGround = true;
  } else {
    onGround = false;
  }

  newX = Math.max(0, Math.min(canvas.width - player.offsetWidth, newX));
  newY = Math.max(0, Math.min(canvas.height - player.offsetHeight, newY));

  player.style.left = newX + 'px';
  player.style.top = newY + 'px';
}

function selectTool(tool) {
  document.querySelectorAll(".tool-button").forEach(btn => btn.classList.remove("selected"));
  document.getElementById(tool).classList.add("selected");
  mode = tool;
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / scale);
  const y = Math.floor((e.clientY - rect.top) / scale);
  if (x < cols && y < rows) {
    if (mode === 'place') {
      map[y][x] = selectedImage;
    } else if (mode === 'remove') {
      map[y][x] = null;
    }
    drawMap();
  }
});

document.addEventListener('keydown', (e) => keys[e.key] = true);
document.addEventListener('keyup', (e) => keys[e.key] = false);

window.addEventListener("gamepadconnected", (e) => {
  gamepadIndex = e.gamepad.index;
});

function getGamepadInput() {
  const gp = navigator.getGamepads()[gamepadIndex];
  if (!gp) return;
  joyPos.x = gp.axes[0];
  if (gp.buttons[0].pressed && onGround) isJumping = true;
}

joystick.addEventListener("touchstart", () => joystickActive = true);
joystick.addEventListener("touchend", () => {
  joystickActive = false;
  joyPos = { x: 0, y: 0 };
  joystickInner.style.transform = "translate(0, 0)";
});
joystick.addEventListener("touchmove", (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = joystick.getBoundingClientRect();
  const dx = touch.clientX - rect.left - rect.width / 2;
  const dy = touch.clientY - rect.top - rect.height / 2;
  joyPos.x = dx / 30;
  joyPos.y = dy / 30;
  joystickInner.style.transform = `translate(${dx}px, ${dy}px)`;
});

document.getElementById("jumpBtn").addEventListener("click", () => {
  if (onGround) isJumping = true;
});

function gameLoop() {
  if (gamepadIndex !== null) getGamepadInput();
  updatePlayer();
  requestAnimationFrame(gameLoop);
}

player.style.left = '100px';
player.style.top = '100px';

drawMap();
gameLoop();

  </script>
</body>
</html>
